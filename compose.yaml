services:
  hdhomerun-xmltv:
    build: .
    container_name: hdhomerun-xmltv
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080

      # Set this to the subnet where your HDHomeRun devices live.
      # Multiple subnets can be comma-separated.
      LAN_CIDRS: "192.168.1.0/24"

      SCAN_INTERVAL_MS: "21600000"
      GUIDE_REFRESH_INTERVAL_MS: "43200000"
      SCAN_CONCURRENCY: "64"
      REQUEST_TIMEOUT_MS: "2500"
    # On Linux, host networking can make LAN discovery simpler.
    # If enabling it, remove the ports section above.
    # network_mode: host
